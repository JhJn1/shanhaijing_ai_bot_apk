name: Build Android APK (Simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            curl \
            unzip \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            zlib1g-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 numpy==1.23.5 kivy==2.2.1
    
    - name: Create minimal Kivy app (if missing)
      run: |
        if [ ! -d "kivy_app" ]; then
          mkdir -p kivy_app
          cat > kivy_app/main.py << 'EOF'
          from kivy.app import App
          from kivy.uix.label import Label
          
          class MyApp(App):
              def build(self):
                  return Label(text='山海经异变AI代练')
          
          if __name__ == '__main__':
              MyApp().run()
          EOF
                    echo "Created example kivy_app/main.py"
                  else
                    echo "kivy_app already exists"
                  fi
              
    - name: Create buildozer spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = 山海经异变AI代练
        package.name = shanhaijing_ai_bot
        package.domain = com.shanhaijing
        source.dir = ./kivy_app
        version = 1.0.0
        requirements = python3,kivy,numpy
        android.api = 31
        android.minapi = 24
        android.archs = arm64-v8a
        p4a.bootstrap = sdl2
        android.accept_sdk_license = True
        EOF
    
    - name: Build APK
      run: |
        echo "开始构建APK..."
        java -version
        buildozer -v android debug 2>&1 | tee build.log
    
    - name: Check build results
      run: |
        echo "=== 构建结果 ==="
        ls -la bin/ || echo "bin目录不存在"
        find . -name "*.apk" || echo "未找到APK文件"
        cat build.log | tail -50
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shanhaijing-apk-simple-build
        path: |
          bin/*.apk
          build.log
          .buildozer/android/logs/*.log
        retention-days: 30
