name: Build Android APK (Simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            curl \
            unzip \
            openjdk-17-jdk \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            zlib1g-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev
        
        # 设置 Java 17 为默认
        sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
        sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
        
        # 安装 Android SDK 命令行工具
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        curl -o commandlinetools-linux.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip commandlinetools-linux.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
        rm commandlinetools-linux.zip
        
        # 设置 Android SDK 环境变量
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        
        # 创建软链接（强制覆盖）
        ln -sf $HOME/android-sdk/cmdline-tools/latest $HOME/android-sdk/tools
        
        # 接受许可证并安装 platform-tools
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools"
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 numpy==1.23.5 kivy==2.2.1
    
    - name: Create minimal Kivy app (if missing)
      run: |
        if [ ! -d "kivy_app" ]; then
          mkdir -p kivy_app
          cat > kivy_app/main.py << 'EOF'
from kivy.app import App
from kivy.uix.label import Label

class MyApp(App):
    def build(self):
        return Label(text='山海经异变AI代练')

if __name__ == '__main__':
    MyApp().run()
EOF
          echo "Created example kivy_app/main.py"
        else
          echo "kivy_app already exists"
        fi
    
    - name: Create buildozer spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = 山海经异变AI代练
        package.name = shanhaijing_ai_bot
        package.domain = com.shanhaijing
        source.dir = ./kivy_app
        version = 1.0.0
        requirements = python3,kivy,numpy
        android.api = 31
        android.minapi = 24
        android.archs = arm64-v8a
        p4a.bootstrap = sdl2
        android.sdk_path = /home/runner/android-sdk
        EOF
    
    - name: Build APK
      run: |
        echo "开始构建APK..."
        java -version  # 确认 Java 版本
        buildozer -v android debug 2>&1 | tee build.log
    
    - name: Check build results
      run: |
        echo "=== 构建结果 ==="
        ls -la bin/ || echo "bin目录不存在"
        find . -name "*.apk" || echo "未找到APK文件"
        cat build.log | tail -50
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shanhaijing-apk-simple-build
        path: |
          bin/*.apk
          build.log
          .buildozer/android/logs/*.log
        retention-days: 30
